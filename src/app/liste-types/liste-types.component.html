<div class="container">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <app-update-type
      [type]="updatedType"
      (typeUpdated)="typeUpdated($event)"
      [ajout]="ajout">
    </app-update-type>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr><th>Id</th><th>Nom Type</th><th colspan="2">Actions</th></tr>
        </thead>
        <tbody>
          @for (t of types; track t.idType) {
            <tr>
              <td>{{ t.idType }}</td>
              <td>{{ t.nomType }}</td>
              <td><a class="btn btn-success btn-sm" (click)="updateType(t)">Editer</a></td>
              <td><a class="btn btn-danger btn-sm" (click)="supprimerType(t)">Supprimer</a></td>
            </tr>
          } @empty {
            <tr><td colspan="4" class="text-center">Aucun type disponible</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
